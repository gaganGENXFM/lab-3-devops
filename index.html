<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>DevOps Lab 2 | From Git to the Web</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101827;
      color: #eef4ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(ellipse at 15% 15%, rgb(56 189 248 / 14%), transparent 38%),
        radial-gradient(ellipse at 85% 85%, rgb(129 140 248 / 15%), transparent 40%),
        #101827;
    }

    main {
      width: min(100%, 760px);
      padding: clamp(28px, 7vw, 64px);
      border: 1px solid rgb(203 213 225 / 14%);
      border-radius: 28px;
      background: rgb(20 30 48 / 88%);
      box-shadow: 0 24px 80px rgb(0 0 0 / 30%);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 22px;
      color: #7dd3fc;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 14px #38bdf8;
      content: "";
    }

    h1 {
      max-width: 620px;
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 5rem);
      letter-spacing: -0.065em;
      line-height: 1.02;
    }

    h1 span {
      color: #7dd3fc;
    }

    .intro {
      max-width: 560px;
      margin: 24px 0 0;
      color: #b8c5d9;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.8;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 38px 0 0;
      padding: 0;
      list-style: none;
    }

    .steps li {
      min-height: 112px;
      padding: 18px;
      border: 1px solid rgb(203 213 225 / 12%);
      border-radius: 16px;
      background: rgb(255 255 255 / 3%);
    }

    .steps strong,
    .steps span {
      display: block;
    }

    .steps strong {
      margin-bottom: 8px;
      color: #7dd3fc;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
    }

    .steps span {
      color: #e2eaf7;
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
    }

    footer {
      margin-top: 36px;
      color: #8291a8;
      font-size: 0.85rem;
    }

    @media (max-width: 560px) {
      .steps {
        grid-template-columns: 1fr;
      }

      .steps li {
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">DevOps Lab 2</p>
    <h1>From <span>Git</span> to the web.</h1>
    <p class="intro">
      A small page with a big journey: track it with Git, share it on GitHub,
      and publish it for the world with GitHub Pages.
    </p>
    <ol class="steps" aria-label="The publishing journey">
      <li><strong>01</strong><span>Build with HTML</span></li>
      <li><strong>02</strong><span>Share with GitHub</span></li>
      <li><strong>03</strong><span>Go live with Pages</span></li>
    </ol>
    <footer>Made for learning. Ready to go live.</footer>
  </main>
</body>
</html>
